<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff6b8a">
  <title>寶寶語言啟蒙 App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink: #ff6b8a;
      --blue: #d2ebff;
      --yellow: #ffd84d;
      --mint: #76ddaf;
      --ink: #25324a;
      --muted: #687189;
      --paper: #fffdf8;
      --white: #ffffff;
      --line: rgba(37, 50, 74, .14);
      --shadow: 0 14px 32px rgba(37, 50, 74, .14);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-width: 320px;
    }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "Noto Sans TC", system-ui, -apple-system, "Microsoft JhengHei", sans-serif;
      background:
        linear-gradient(135deg, rgba(255, 107, 138, .18), transparent 30%),
        linear-gradient(225deg, rgba(210, 235, 255, .9), transparent 34%),
        linear-gradient(180deg, #fff8dd 0%, #fffdf8 44%, #eaf7ff 100%);
      min-height: 100vh;
    }

    button {
      border: 0;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    .app {
      width: min(100%, 980px);
      margin: 0 auto;
      padding: max(14px, env(safe-area-inset-top)) 14px max(96px, env(safe-area-inset-bottom));
    }

    header {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }

    .mark {
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--pink), var(--yellow));
      box-shadow: var(--shadow);
      font-size: 34px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 7vw, 2.45rem);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 1rem;
      font-weight: 700;
    }

    .tabs {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 8px;
      margin: 0 0 14px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(255, 255, 255, .86);
      box-shadow: 0 10px 24px rgba(37, 50, 74, .1);
      backdrop-filter: blur(12px);
    }

    .tab {
      min-height: 58px;
      padding: 8px 6px;
      border-radius: 16px;
      background: transparent;
      font-size: clamp(.9rem, 3.7vw, 1.08rem);
      font-weight: 900;
      line-height: 1.15;
    }

    .tab.active {
      background: var(--yellow);
      box-shadow: inset 0 -4px 0 rgba(37, 50, 74, .11);
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
      animation: rise .22s ease both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .surface {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, .9);
      box-shadow: var(--shadow);
      padding: 14px;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .big-button,
    .chip,
    .select {
      min-height: 48px;
      border-radius: 16px;
      padding: 0 16px;
      font-weight: 900;
      font-size: 1rem;
      background: var(--white);
      box-shadow: 0 8px 18px rgba(37, 50, 74, .1);
    }

    .big-button {
      min-height: 56px;
      font-size: 1.15rem;
      background: linear-gradient(135deg, var(--yellow), #ffb84f);
    }

    .big-button.secondary {
      background: linear-gradient(135deg, var(--blue), #ffffff);
    }

    .chip.active {
      background: var(--pink);
      color: var(--white);
    }

    .prompt-box {
      position: relative;
      overflow: hidden;
      min-height: 94px;
      display: grid;
      align-content: center;
      gap: 6px;
      padding: 16px;
      margin-bottom: 14px;
      border-radius: 22px;
      background: linear-gradient(135deg, var(--blue), #ffffff 64%, #fff5c9);
    }

    .prompt {
      margin: 0;
      font-size: clamp(1.55rem, 8vw, 3rem);
      font-weight: 900;
      line-height: 1.1;
    }

    .feedback {
      min-height: 30px;
      color: var(--muted);
      font-size: 1.1rem;
      font-weight: 900;
    }

    .flash-grid {
      display: grid;
      grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr));
      gap: 12px;
    }

    .flash-card {
      position: relative;
      overflow: hidden;
      min-height: 156px;
      border-radius: 22px;
      background: var(--white);
      box-shadow: 0 12px 24px rgba(37, 50, 74, .13);
      border: 3px solid transparent;
    }

    .flash-emoji {
      display: grid;
      place-items: center;
      min-height: 120px;
      font-size: clamp(4.6rem, 22vw, 8rem);
      background: linear-gradient(180deg, #ffffff, #fff4c7);
    }

    .flash-label {
      display: block;
      padding: 10px 8px 12px;
      text-align: center;
      font-size: clamp(1.55rem, 8vw, 2.35rem);
      font-weight: 900;
      line-height: 1;
    }

    .flash-card.correct {
      border-color: var(--mint);
      animation: flash .72s ease;
    }

    .flash-card.wrong {
      border-color: var(--pink);
      animation: shake .42s ease;
    }

    @keyframes flash {
      40% {
        transform: scale(1.035);
        box-shadow: 0 0 0 10px rgba(255, 216, 77, .48), 0 0 34px rgba(255, 107, 138, .4);
      }
    }

    @keyframes shake {
      20% { transform: translateX(-7px); }
      40% { transform: translateX(7px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }

    .stars {
      pointer-events: none;
      position: absolute;
      inset: 0;
      opacity: 0;
    }

    .stars.show {
      opacity: 1;
    }

    .stars span {
      position: absolute;
      font-size: 34px;
      animation: starPop .82s ease both;
    }

    .stars span:nth-child(1) { left: 16%; top: 18%; }
    .stars span:nth-child(2) { right: 12%; top: 26%; animation-delay: .08s; }
    .stars span:nth-child(3) { left: 44%; bottom: 12%; animation-delay: .16s; }

    @keyframes starPop {
      from { transform: scale(.2) translateY(20px); opacity: 0; }
      45% { opacity: 1; }
      to { transform: scale(1.25) translateY(-24px); opacity: 0; }
    }

    .mimic-layout {
      display: grid;
      gap: 14px;
    }

    .mouth-stage {
      min-height: 290px;
      display: grid;
      place-items: center;
      border-radius: var(--radius);
      background:
        repeating-linear-gradient(45deg, rgba(255, 216, 77, .16) 0 12px, transparent 12px 24px),
        linear-gradient(180deg, #ffffff, var(--blue));
    }

    .face {
      position: relative;
      width: min(76vw, 280px);
      aspect-ratio: 1;
      border-radius: 45% 45% 50% 50%;
      background: #ffd1bd;
      box-shadow: inset 0 -18px 0 rgba(212, 112, 92, .18);
    }

    .eye {
      position: absolute;
      top: 32%;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--ink);
    }

    .eye.left { left: 30%; }
    .eye.right { right: 30%; }

    .mouth {
      position: absolute;
      left: 50%;
      top: 60%;
      width: 96px;
      height: 20px;
      border-radius: 999px;
      background: #8a2843;
      transform: translateX(-50%);
      overflow: hidden;
      animation: openMouth 2.4s ease-in-out infinite;
    }

    .mouth::after {
      content: "";
      position: absolute;
      left: 22px;
      right: 22px;
      bottom: -8px;
      height: 24px;
      border-radius: 50% 50% 0 0;
      background: #ff8aa4;
    }

    .mouth.press {
      animation-name: pressMouth;
    }

    .mouth.pop {
      animation-name: popMouth;
    }

    .mouth.tap {
      animation-name: tapMouth;
    }

    .mouth.back {
      animation-name: backMouth;
    }

    @keyframes openMouth {
      0%, 100% { height: 18px; width: 92px; }
      48% { height: 58px; width: 106px; border-radius: 18px 18px 54px 54px; }
    }

    @keyframes pressMouth {
      0%, 100% { height: 10px; width: 104px; }
      46% { height: 46px; width: 96px; border-radius: 18px 18px 50px 50px; }
    }

    @keyframes popMouth {
      0%, 35%, 100% { height: 9px; width: 100px; }
      56% { height: 62px; width: 112px; border-radius: 20px 20px 56px 56px; }
    }

    @keyframes tapMouth {
      0%, 100% { height: 16px; width: 92px; }
      45% { height: 44px; width: 88px; border-radius: 20px; }
    }

    @keyframes backMouth {
      0%, 100% { height: 24px; width: 84px; }
      50% { height: 64px; width: 116px; border-radius: 22px 22px 58px 58px; }
    }

    .sound-text {
      margin: 0;
      text-align: center;
      color: var(--pink);
      font-size: clamp(3.4rem, 20vw, 6.5rem);
      font-weight: 900;
      line-height: .98;
      text-shadow: 0 7px 0 rgba(255, 216, 77, .5);
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 1.08rem;
      font-weight: 700;
      line-height: 1.55;
    }

    .sound-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    .sound-button {
      min-height: 64px;
      border-radius: 18px;
      background: var(--white);
      box-shadow: 0 8px 18px rgba(37, 50, 74, .1);
      font-size: 1.45rem;
      font-weight: 900;
    }

    .sound-button.active {
      background: var(--pink);
      color: var(--white);
    }

    .song-select {
      width: 100%;
      min-height: 56px;
      border: 0;
      border-radius: 18px;
      padding: 0 16px;
      color: var(--ink);
      background: var(--white);
      box-shadow: 0 8px 18px rgba(37, 50, 74, .1);
      font: inherit;
      font-size: 1.1rem;
      font-weight: 900;
    }

    .lyric-card {
      display: grid;
      align-content: center;
      min-height: 238px;
      padding: 18px;
      border-radius: var(--radius);
      background: linear-gradient(180deg, #ffffff, #fff3bf);
      box-shadow: inset 0 -5px 0 rgba(255, 107, 138, .16);
    }

    .song-title {
      margin: 0 0 10px;
      color: #2c67bd;
      font-size: clamp(1.55rem, 7vw, 2.45rem);
      font-weight: 900;
    }

    .lyric-line {
      margin: 0;
      font-size: clamp(1.8rem, 8vw, 3.2rem);
      font-weight: 900;
      line-height: 1.25;
    }

    .blank-word {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 4.2em;
      min-height: 1.42em;
      border-radius: 16px;
      padding: 0 .28em;
      color: var(--ink);
      background: var(--pink);
      box-shadow: 0 0 0 6px rgba(255, 107, 138, .18);
      animation: blink 1s ease-in-out infinite;
    }

    .blank-word.revealed {
      color: var(--white);
      animation: none;
      background: #31b978;
    }

    @keyframes blink {
      50% { background: var(--yellow); box-shadow: 0 0 0 10px rgba(255, 216, 77, .2); }
    }

    .progress-wrap {
      height: 16px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(37, 50, 74, .12);
      margin-top: 14px;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--pink), var(--yellow));
      transition: width .35s ease;
    }

    .beat-row {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 8px;
      margin-top: 14px;
    }

    .beat {
      height: 18px;
      border-radius: 999px;
      background: var(--blue);
      transform-origin: bottom;
    }

    .beat.active {
      background: var(--yellow);
      animation: beat .42s ease;
    }

    @keyframes beat {
      45% { transform: scaleY(1.85); }
    }

    .helper {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: .98rem;
      font-weight: 700;
      line-height: 1.45;
    }

    @media (min-width: 620px) {
      .app {
        padding-inline: 22px;
      }

      .flash-grid {
        grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr));
      }

      .mimic-layout {
        grid-template-columns: 1fr .9fr;
        align-items: stretch;
      }

      .mouth-stage {
        min-height: 430px;
      }
    }

    @media (max-width: 380px) {
      .flash-grid {
        gap: 9px;
      }

      .flash-emoji {
        min-height: 112px;
      }

      .sound-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="mark" aria-hidden="true">👶</div>
      <div>
        <h1>寶寶語言啟蒙</h1>
        <p class="subtitle">6-18 個月，物件、嘴型、兒歌互動練習</p>
      </div>
    </header>

    <nav class="tabs" aria-label="功能頁籤">
      <button class="tab active" data-tab="flashcards" type="button">物件<br>聲音</button>
      <button class="tab" data-tab="mimicry" type="button">嘴型<br>模仿</button>
      <button class="tab" data-tab="rhymes" type="button">互動<br>兒歌</button>
    </nav>

    <section class="panel active" id="flashcards" aria-labelledby="flashTitle">
      <div class="surface">
        <div class="row">
          <button class="big-button" id="questionMode" type="button">開始問答</button>
          <button class="big-button secondary" id="addCards" type="button">增加圖片</button>
        </div>
        <div class="prompt-box">
          <p class="prompt" id="flashTitle">點圖片，聽發音</p>
          <div class="feedback" id="flashFeedback">先從 2 張開始，答對後會慢慢增加到 4 張。</div>
          <div class="stars" id="stars" aria-hidden="true"><span>⭐</span><span>✨</span><span>⭐</span></div>
        </div>
        <div class="flash-grid" id="flashGrid" style="--cols: 2;"></div>
      </div>
    </section>

    <section class="panel" id="mimicry" aria-labelledby="soundText">
      <div class="mimic-layout">
        <div class="mouth-stage">
          <div>
            <p class="sound-text" id="soundText">ㄇㄚ</p>
            <div class="face" aria-label="嘴型示意圖">
              <span class="eye left"></span>
              <span class="eye right"></span>
              <span class="mouth press" id="mouthShape"></span>
            </div>
          </div>
        </div>
        <div class="surface">
          <div class="row">
            <button class="big-button" id="speakSyllable" type="button">慢速朗讀</button>
            <button class="big-button secondary" id="autoMimic" type="button">自動輪播</button>
          </div>
          <p class="hint" id="soundHint">輕輕閉上嘴巴，再慢慢張開發出「媽」。</p>
          <div class="sound-grid" id="soundGrid"></div>
          <p class="helper">給家長：坐在寶寶正前方，先誇張示範嘴型，再按朗讀讓寶寶看見聲音和嘴巴的連結。</p>
        </div>
      </div>
    </section>

    <section class="panel" id="rhymes" aria-labelledby="songTitle">
      <div class="surface">
        <div class="row">
          <select class="song-select" id="songSelect" aria-label="選擇兒歌"></select>
          <button class="big-button" id="nextLine" type="button">下一句</button>
        </div>
        <div class="lyric-card">
          <h2 class="song-title" id="songTitle">兩隻老虎</h2>
          <p class="lyric-line" id="lyricLine"></p>
          <div class="progress-wrap" aria-label="歌詞進度">
            <div class="progress-bar" id="songProgress"></div>
          </div>
          <div class="beat-row" id="beatRow" aria-hidden="true"></div>
        </div>
        <p class="helper">點閃爍的留白詞，App 會唸出關鍵詞並前進到下一句。</p>
      </div>
    </section>
  </main>

  <script>
    const $ = (selector) => document.querySelector(selector);
    const $$ = (selector) => [...document.querySelectorAll(selector)];

    const flashItems = [
      { id: "dog", emoji: "🐶", word: "狗狗", question: "狗狗在哪裡？" },
      { id: "cat", emoji: "🐱", word: "貓咪", question: "貓咪在哪裡？" },
      { id: "apple", emoji: "🍎", word: "蘋果", question: "蘋果在哪裡？" },
      { id: "car", emoji: "🚗", word: "車車", question: "車車在哪裡？" },
      { id: "baby", emoji: "👶", word: "寶寶", question: "寶寶在哪裡？" },
      { id: "ball", emoji: "⚽", word: "球球", question: "球球在哪裡？" }
    ];

    const syllables = [
      { text: "ㄇㄚ", speak: "媽", shape: "press", hint: "輕輕閉上嘴巴，再慢慢張開發出「媽」。" },
      { text: "ㄅㄚ", speak: "爸", shape: "pop", hint: "雙唇先閉起來，像小泡泡一樣突然打開。" },
      { text: "ㄆㄚ", speak: "趴", shape: "pop", hint: "閉唇後送出一點氣，讓嘴唇輕輕彈開。" },
      { text: "ㄉㄚ", speak: "搭", shape: "tap", hint: "舌尖輕碰上排牙齒後方，再放開成「搭」。" },
      { text: "ㄊㄚ", speak: "他", shape: "tap", hint: "舌尖輕點上方，放開時多一點氣流。" },
      { text: "ㄍㄚ", speak: "嘎", shape: "back", hint: "嘴巴張大一點，聲音從舌頭後方輕輕出來。" }
    ];

    const songs = [
      {
        title: "兩隻老虎",
        lines: [
          { lead: "兩隻小老虎，跑得真", key: "快" },
          { lead: "一隻笑咪咪，一隻搖尾", key: "巴" },
          { lead: "寶寶拍拍手，一起說", key: "嗨" }
        ]
      },
      {
        title: "小星星",
        lines: [
          { lead: "小星星亮晶晶，掛在天", key: "上" },
          { lead: "一閃一閃眨眼睛，陪寶寶睡", key: "覺" },
          { lead: "輕輕唱一聲，星星說晚", key: "安" }
        ]
      },
      {
        title: "拔蘿蔔",
        lines: [
          { lead: "大蘿蔔長得大，大家來", key: "拔" },
          { lead: "一二三用力拉，蘿蔔出", key: "來" },
          { lead: "抱著蘿蔔笑哈哈，一起回", key: "家" }
        ]
      },
      {
        title: "蝴蝶",
        lines: [
          { lead: "小蝴蝶飛呀飛，飛到花", key: "園" },
          { lead: "翅膀輕輕拍拍，停在花", key: "邊" },
          { lead: "寶寶伸出小手，說聲再", key: "見" }
        ]
      },
      {
        title: "妹妹背著洋娃娃",
        lines: [
          { lead: "妹妹抱著小娃娃，慢慢走", key: "路" },
          { lead: "娃娃笑著看花花，心情很", key: "好" },
          { lead: "一起回家喝牛奶，抱抱睡", key: "覺" }
        ]
      }
    ];

    let audioContext;
    let visibleCount = 2;
    let questionMode = false;
    let targetItem = null;
    let syllableIndex = 0;
    let mimicTimer = null;
    let songIndex = 0;
    let lineIndex = 0;
    let revealTimer = null;
    let beatTimer = null;

    function getAudioContext() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return null;
      audioContext ||= new AudioContextClass();
      if (audioContext.state === "suspended") audioContext.resume();
      return audioContext;
    }

    function playToneSequence(notes) {
      const ctx = getAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;
      notes.forEach((note, index) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = note;
        gain.gain.setValueAtTime(0.0001, now + index * 0.16);
        gain.gain.exponentialRampToValueAtTime(0.22, now + index * 0.16 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + index * 0.16 + 0.14);
        osc.connect(gain).connect(ctx.destination);
        osc.start(now + index * 0.16);
        osc.stop(now + index * 0.16 + 0.16);
      });
    }

    function playSuccess() {
      playToneSequence([523.25, 587.33, 659.25]);
    }

    function playWrong() {
      playToneSequence([164.81, 146.83, 130.81]);
    }

    function speak(text, options = {}) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "zh-TW";
      utterance.rate = options.rate ?? 0.72;
      utterance.pitch = options.pitch ?? 1.18;
      utterance.volume = 1;
      window.speechSynthesis.speak(utterance);
    }

    function pickTarget(items) {
      return items[Math.floor(Math.random() * items.length)];
    }

    function renderFlashcards() {
      const grid = $("#flashGrid");
      const items = flashItems.slice(0, visibleCount);
      grid.style.setProperty("--cols", String(Math.min(visibleCount, 4)));
      grid.innerHTML = items.map((item) => `
        <button class="flash-card" type="button" data-id="${item.id}" aria-label="${item.word}">
          <span class="flash-emoji" aria-hidden="true">${item.emoji}</span>
          <span class="flash-label">${item.word}</span>
        </button>
      `).join("");
      grid.querySelectorAll(".flash-card").forEach((card) => {
        card.addEventListener("click", () => handleFlashTap(card));
      });
      if (questionMode) askQuestion();
    }

    function askQuestion() {
      const items = flashItems.slice(0, visibleCount);
      targetItem = pickTarget(items);
      $("#flashTitle").textContent = targetItem.question;
      $("#flashFeedback").textContent = "請寶寶點一張圖片。";
      speak(targetItem.question, { rate: 0.78, pitch: 1.1 });
    }

    function handleFlashTap(card) {
      const item = flashItems.find((entry) => entry.id === card.dataset.id);
      getAudioContext();

      if (!questionMode) {
        speak(item.word, { rate: 0.7, pitch: 1.22 });
        $("#flashTitle").textContent = item.word;
        $("#flashFeedback").textContent = "再點一次也可以重複聽。";
        card.classList.add("correct");
        setTimeout(() => card.classList.remove("correct"), 760);
        return;
      }

      if (item.id === targetItem.id) {
        card.classList.add("correct");
        $("#flashFeedback").textContent = "答對了，好棒！";
        $("#stars").classList.add("show");
        playSuccess();
        speak(`${item.word}，答對了`, { rate: 0.76, pitch: 1.28 });
        if (visibleCount < 4) visibleCount += 1;
        setTimeout(() => {
          $("#stars").classList.remove("show");
          card.classList.remove("correct");
          renderFlashcards();
        }, 1100);
      } else {
        card.classList.add("wrong");
        $("#flashFeedback").textContent = "再試一次，找找看喔。";
        playWrong();
        speak("再試一次", { rate: 0.72, pitch: 1 });
        setTimeout(() => card.classList.remove("wrong"), 500);
      }
    }

    function setSyllable(index, shouldSpeak = false) {
      syllableIndex = (index + syllables.length) % syllables.length;
      const item = syllables[syllableIndex];
      $("#soundText").textContent = item.text;
      $("#soundHint").textContent = item.hint;
      $("#mouthShape").className = `mouth ${item.shape}`;
      $$(".sound-button").forEach((button) => {
        button.classList.toggle("active", Number(button.dataset.index) === syllableIndex);
      });
      if (shouldSpeak) {
        getAudioContext();
        speak(item.speak, { rate: 0.5, pitch: 1.08 });
      }
    }

    function renderSyllables() {
      $("#soundGrid").innerHTML = syllables.map((item, index) => `
        <button class="sound-button ${index === 0 ? "active" : ""}" type="button" data-index="${index}">${item.text}</button>
      `).join("");
      $$(".sound-button").forEach((button) => {
        button.addEventListener("click", () => {
          stopMimicAuto();
          setSyllable(Number(button.dataset.index), true);
        });
      });
    }

    function stopMimicAuto() {
      clearInterval(mimicTimer);
      mimicTimer = null;
      $("#autoMimic").textContent = "自動輪播";
    }

    function toggleMimicAuto() {
      getAudioContext();
      if (mimicTimer) {
        stopMimicAuto();
        return;
      }
      $("#autoMimic").textContent = "停止輪播";
      setSyllable(syllableIndex, true);
      mimicTimer = setInterval(() => {
        setSyllable(syllableIndex + 1, true);
      }, 2800);
    }

    function renderSongOptions() {
      $("#songSelect").innerHTML = songs.map((song, index) => `
        <option value="${index}">${song.title}</option>
      `).join("");
    }

    function renderBeats() {
      $("#beatRow").innerHTML = Array.from({ length: 8 }, (_, index) => `<span class="beat" data-beat="${index}"></span>`).join("");
    }

    function pulseBeats() {
      let index = 0;
      clearInterval(beatTimer);
      beatTimer = setInterval(() => {
        $$(".beat").forEach((beat) => beat.classList.remove("active"));
        const current = $(`.beat[data-beat="${index % 8}"]`);
        current?.classList.add("active");
        index += 1;
      }, 260);
    }

    function renderLyric(revealed = false) {
      const song = songs[songIndex];
      const line = song.lines[lineIndex];
      $("#songTitle").textContent = song.title;
      $("#lyricLine").innerHTML = `${line.lead}<button class="blank-word ${revealed ? "revealed" : ""}" id="blankWord" type="button">${revealed ? line.key : "？"}</button>`;
      const progress = ((lineIndex + (revealed ? 1 : 0)) / song.lines.length) * 100;
      $("#songProgress").style.width = `${Math.min(progress, 100)}%`;
      $("#blankWord").addEventListener("click", () => revealKeyword());
      pulseBeats();
    }

    function revealKeyword() {
      const song = songs[songIndex];
      const line = song.lines[lineIndex];
      getAudioContext();
      clearTimeout(revealTimer);
      renderLyric(true);
      speak(line.key, { rate: 0.66, pitch: 1.22 });
      playToneSequence([392, 523.25]);
      revealTimer = setTimeout(nextSongLine, 1400);
    }

    function nextSongLine() {
      clearTimeout(revealTimer);
      lineIndex += 1;
      if (lineIndex >= songs[songIndex].lines.length) {
        lineIndex = 0;
      }
      renderLyric(false);
    }

    function switchTab(tabId) {
      $$(".tab").forEach((tab) => tab.classList.toggle("active", tab.dataset.tab === tabId));
      $$(".panel").forEach((panel) => panel.classList.toggle("active", panel.id === tabId));
      window.speechSynthesis?.cancel();
      if (tabId !== "mimicry") stopMimicAuto();
    }

    $$(".tab").forEach((tab) => tab.addEventListener("click", () => switchTab(tab.dataset.tab)));

    $("#questionMode").addEventListener("click", () => {
      getAudioContext();
      questionMode = !questionMode;
      $("#questionMode").textContent = questionMode ? "停止問答" : "開始問答";
      if (questionMode) {
        askQuestion();
      } else {
        $("#flashTitle").textContent = "點圖片，聽發音";
        $("#flashFeedback").textContent = "自由點選模式：每張圖都會唸出名稱。";
      }
    });

    $("#addCards").addEventListener("click", () => {
      visibleCount = visibleCount >= 4 ? 2 : visibleCount + 1;
      renderFlashcards();
      $("#flashFeedback").textContent = `現在顯示 ${visibleCount} 張圖片。`;
    });

    $("#speakSyllable").addEventListener("click", () => setSyllable(syllableIndex, true));
    $("#autoMimic").addEventListener("click", toggleMimicAuto);

    $("#songSelect").addEventListener("change", (event) => {
      songIndex = Number(event.target.value);
      lineIndex = 0;
      renderLyric(false);
    });

    $("#nextLine").addEventListener("click", nextSongLine);

    renderFlashcards();
    renderSyllables();
    renderSongOptions();
    renderBeats();
    renderLyric(false);
  </script>
</body>
</html>
